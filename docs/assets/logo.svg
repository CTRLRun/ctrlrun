<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="CTRLRun">
  <!-- The mark: a keycap — the CTRL key — with the run triangle cut out of it. Amber is the
       brand accent (#F5A623 on dark, #B8730A as the key's edge and the light-mode link colour). -->
