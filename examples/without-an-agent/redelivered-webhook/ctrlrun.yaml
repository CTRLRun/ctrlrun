# The policy this example runs under. Unknown actions are denied; there is no default-allow.
schema: ctrlrun.policy/v1

actions:
  # Both ends bound: `amount_lte` alone lets a negative amount through, and a payout of a
  # negative amount is a collection.
  payouts.send:
    rules:
      - when: { amount_gte: 0, amount_lte: 1000000 }    # €0.00 to €10,000.00
        decision: allow
      - decision: deny
