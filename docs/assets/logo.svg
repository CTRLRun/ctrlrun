  <rect x="40" y="40" width="432" height="400" rx="96" fill="#F5A623"/>
  <path d="M204 152 L344 240 L204 328 Z" fill="#14161b" stroke="#14161b" stroke-width="28" stroke-linejoin="round"/>
</svg>
