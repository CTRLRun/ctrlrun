[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrlrun"
version = "0.2.0.dev0"
description = "Make consequential AI-agent actions safe to execute."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Arpan Ghoshal", email = "contact@arpanghoshal.com"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml",
    "click",
]

[project.urls]
Homepage = "https://github.com/CTRLRun/ctrlrun"
Repository = "https://github.com/CTRLRun/ctrlrun"
Documentation = "https://github.com/CTRLRun/ctrlrun/tree/main/docs"
Changelog = "https://github.com/CTRLRun/ctrlrun/blob/main/CHANGELOG.md"
Issues = "https://github.com/CTRLRun/ctrlrun/issues"

[project.scripts]
ctrlrun = "ctrlrun.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=2.3",
    "ruff>=0.16",
]
# SPEC-v0.2 §1: `pip install ctrlrun` must not grow. Anything needing an HTTP server or a
# third-party SDK lands here, lazily imported, with `MissingDependency` when it is absent.
#
# The gateway's only dependency is an HTTP client (§6.11): the listening side is stdlib
# `http.server`, and what an ASGI stack would add is a second server, not a capability.
# What is needed is a connect/write/read exception taxonomy precise enough to feed §6.8's
# first row — a gateway that could not tell "never connected" from "no reply" would have to
# call everything AMBIGUOUS, which is safe and useless.
gateway = ["httpx>=0.27"]
# Item 8 adds the OpenTelemetry API, SDK and OTLP/HTTP exporter.
otel = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctrlrun = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
# PyYAML ships no stubs and types-PyYAML would be a new dependency. safe_load returns
# untyped data either way; policy.py validates every value before use (SPEC-v0.1 §3.4).
module = "yaml"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Error class names are frozen by SPEC-v0.1 §8; no "Error" suffix.
"src/ctrlrun/errors.py" = ["N818"]
# SPEC-v0.1 §5.3 freezes `commit_effect(effect_key, action_id, result: Any)`. An executor's
# return value has no narrower type, and the store only serializes it.
"src/ctrlrun/state.py" = ["ANN401"]
# Type hints are a src/ constraint; tests stay cheap to write. N802 lets acceptance
# tests carry the SPEC §7 identifier verbatim (test_T7_...).
"tests/*" = ["ANN", "N802"]
