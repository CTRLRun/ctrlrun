schema: ctrlrun.policy/v2

actions:
  iam.grant_role:
    effect: "grant:{principal}:{role}"
    resource: "project:{project}"
    rules:
      - when: { role_eq: admin }
        decision: deny
      - when: { role_in: [reader, viewer] }
        decision: allow
      - decision: approve
  iam.revoke_role:
    effect: "revoke:{principal}:{role}"
    decision: allow
