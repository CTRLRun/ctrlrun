# Every action is pinned to a commit SHA (with its version in a comment), so an update is a
# pull request that CI runs, not a tag somebody moved. Dependabot keeps the SHAs current: one
# grouped pull request a month, because ten one-line pull requests in a morning is noise that
# gets merged unread.
#
# The pip entry covers `requirements/` and nothing else. Those are the hash-pinned files CI
# installs from (`scripts/lock.sh` writes them), and a pin nobody moves is a pin to last
# year's bugs, so they move weekly, grouped. The version floors in pyproject.toml are not in
# scope: they are deliberate minimums, each with a reasoned comment, and a floor bump would
# exclude working installations for no gain. Security updates are a repository setting
# (Dependabot alerts and security updates), not this file, and stay on.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    groups:
      locks:
        patterns: ["*"]
    # atheris >=3.1 publishes wheels for CPython 3.12 to 3.14 only and no sdist, and fuzz.yml
    # runs 3.11: the bound in `requirements/in/atheris.in` says so. Dependabot relaxes a source
    # bound that blocks an update, so without this it reopens the same unbuildable pull request
    # every week. Lift both together when the fuzz job's Python version moves.
    ignore:
      - dependency-name: atheris
        versions: [">=3.1"]
