[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrlrun"
version = "0.5.0"
description = "Make consequential AI-agent actions safe to execute."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Arpan Ghoshal", email = "contact@arpanghoshal.com"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    # SPEC-v0.3 §4.2: a grant's `expires_at` must carry an offset, and PyYAML 6 is the floor that
    # makes that checkable. PyYAML 5 subtracts the offset and hands back a naive datetime, which
    # would reject the specification's own example at load.
    "pyyaml>=6.0",
    "click",
]

[project.urls]
Homepage = "https://github.com/CTRLRun/ctrlrun"
Repository = "https://github.com/CTRLRun/ctrlrun"
Documentation = "https://github.com/CTRLRun/ctrlrun/tree/main/docs"
Changelog = "https://github.com/CTRLRun/ctrlrun/blob/main/CHANGELOG.md"
Issues = "https://github.com/CTRLRun/ctrlrun/issues"

[project.scripts]
ctrlrun = "ctrlrun.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=2.3",
    "ruff>=0.16",
    # SPEC-v0.4 §4.3 - T115 validates `ctrlrun verify --junit` against the checked-in
    # `tests/data/junit-10.xsd`. JUnit XML has no normative schema, so the schema is a
    # de-facto one and the test asserts structurally as well; `xmlschema` is used by that
    # test and by nothing else, and `ctrlrun` never imports it.
    "xmlschema>=3",
    # SPEC-v0.5 §6.1 - T136 builds the wheel and the sdist and asserts neither carries an
    # adapter. Without `build` here the test skipped, and it skipped in *both* CI jobs: the
    # `check` job installs `[dev,gateway,otel,identity]`, and the sdist job installs the same
    # four. A definition-of-done check that skips everywhere it runs is the false green this
    # repository keeps finding, so the dependency is named rather than assumed.
    "build>=1",
]
# SPEC-v0.2 §1: `pip install ctrlrun` must not grow. Anything needing an HTTP server or a
# third-party SDK lands here, lazily imported, with `MissingDependency` when it is absent.
#
# The gateway's only dependency is an HTTP client (§6.11): the listening side is stdlib
# `http.server`, and what an ASGI stack would add is a second server, not a capability.
# What is needed is a connect/write/read exception taxonomy precise enough to feed §6.8's
# first row — a gateway that could not tell "never connected" from "no reply" would have to
# call everything AMBIGUOUS, which is safe and useless.
gateway = ["httpx>=0.27"]
# §8's sink hands spans to whatever processor the application configured. The API alone
# would be enough for a library, but an operator installing this extra wants to be able to
# export without assembling a stack, so the SDK and the OTLP/HTTP exporter come with it.
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
# SPEC-v0.3 §3.4 — `JWTIdentityProvider` is the only part of the authority model that needs a
# third party: verifying somebody else's signature. Everything else — grants, containment,
# delegation, observe mode — is stdlib and the YAML parser that is already a dependency.
#
# `[crypto]` rather than bare `pyjwt`: without it PyJWT can only do `HS*`, and every
# asymmetric algorithm — which is what a JWKS deployment uses — raises at verification time
# rather than at install time. An extra that installs cleanly and then cannot verify an RS256
# token is worse than one that names its dependency.
identity = ["pyjwt[crypto]>=2.8"]
# SPEC-v0.6 §4. The Postgres backend is the one thing in v0.6 that needs a third-party
# driver; the migration runner, the chain, the policy hash and the store conformance suite
# are all core and stdlib, for `v0.4 §1`'s reason -- a check somebody has to remember to
# install is a check that does not run, and a *migration* somebody has to remember to
# install is worse than a check.
#
# psycopg 3 rather than psycopg2: `ON CONFLICT ... RETURNING`, a `sqlstate` on every error
# (which §4.3.1's stated-abort set reads), and context-managed cursors. The binary wheel is
# not required here -- an operator who wants the C implementation installs `psycopg[c]`.
postgres = ["psycopg>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctrlrun = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # SPEC-v0.3 §4.1 / T66: a test that legitimately builds an `authority:` section, and
    # may therefore append one of the five §7 event types. `tests/conftest.py` fails any
    # unmarked test that appends one, which is what "no `authority:` section behaves
    # exactly as v0.2" means mechanically inside one pytest process.
    "authority: builds an `authority:` section (SPEC-v0.3 §4.1)",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
# PyYAML ships no stubs and types-PyYAML would be a new dependency. safe_load returns
# untyped data either way; policy.py validates every value before use (SPEC-v0.1 §3.4).
module = "yaml"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# So an exclusion means the same thing however ruff is invoked. Without this, a path named
# explicitly on the command line skips the exclude list, and `ruff format docs/SPEC-v0.3.md`
# would reformat what `ruff format` leaves alone — the same surprise in a smaller box.
force-exclude = true

[tool.ruff.format]
# The formatter reads Python code blocks inside Markdown; the linter does not (`ruff check`
# on a `.md` reports "No Python files found"). That asymmetry is a trap: whether a spec's
# examples get reformatted depends on whether they happen to parse, so SPEC-v0.1 and v0.2
# keep their aligned comments only because theirs carry placeholders like `<generated>`, and
# SPEC-v0.3 lost its alignment to a check that had never fired before. A specification's code
# blocks are illustration, not code — they elide, they annotate, they line comments up to be
# read — and the formatter has no way to know that. So it leaves Markdown alone, and the two
# tools now agree on what a `.md` file is.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Error class names are frozen by SPEC-v0.1 §8; no "Error" suffix.
"src/ctrlrun/errors.py" = ["N818"]
# An adapter's own refusals follow this codebase's convention and not the suffix rule, for the
# same reason `errors.py` does: they sit beside `ActionDenied`, `ApprovalRequired` and
# `DuplicateEffect` in an operator's `except` clause, and `ApprovalNotAskedError` next to those
# would be the odd one out. Adapters are separate distributions (SPEC-v0.5 §6.1) and are not
# packaged with the kernel; they are linted here because they live in this repository.
"adapters/*/src/*/__init__.py" = ["N818"]
# SPEC-v0.1 §5.3 freezes `commit_effect(effect_key, action_id, result: Any)`. An executor's
# return value has no narrower type, and the store only serializes it.
"src/ctrlrun/state.py" = ["ANN401"]
# SPEC-v0.6 §3, §4. Both take a DB-API 2.0 connection, and there is no shared type for one:
# `sqlite3.Connection` and `psycopg.Connection` have no common ancestor, and psycopg is behind
# a lazy import so its type is not even importable here. Narrowing to either would be a lie
# about the other, and a `Protocol` for "has execute, commit and rollback" would be a fourth
# description of DB-API that nothing checks.
"src/ctrlrun/migrations.py" = ["ANN401"]
"src/ctrlrun/postgres.py" = ["ANN401"]
# The gateway's subject matter is untyped JSON off a socket: a JSON-RPC `params`, a tool's
# result, an HTTP client's response object behind a lazy import. Narrowing those to a lie
# would be worse than saying `Any` and validating at the boundary, which is what mcp.py
# does. N818: the error names follow this codebase's convention (DuplicateEffect,
# AmbiguousEffect), not the suffix rule.
"src/ctrlrun/gateway/*.py" = ["ANN401", "N818"]
# Same reasoning for the ACS adapter: its subject matter is an untyped JSON-RPC envelope off
# somebody else's wire, and `_Unknown` follows this codebase's error naming.
"src/ctrlrun/acs.py" = ["ANN401", "N818"]
# The OTel sink holds objects from a lazily-imported SDK: annotating them would mean
# importing `opentelemetry` at module scope, which is the one thing §1.1 forbids.
"src/ctrlrun/otel.py" = ["ANN401"]
# Same reasoning for the JWT provider: the verifier, its exceptions and the key material a
# JWK parses into all come from a lazily-imported `jwt`, and naming their types would mean
# importing it at module scope. The claims themselves are untyped JSON off somebody else's
# wire, validated at the boundary before anything reaches a `Principal`.
"src/ctrlrun/jwt_identity.py" = ["ANN401"]
# `verify` drives the kernel with values it synthesized from somebody's YAML: an argument is
# `str | int | bool | None` by SPEC-v0.1 §2.3 and nothing narrower, and a fake executor's
# return value has no type at all — the same reasoning that exempts `state.py`. N818: the
# refusal names follow this codebase's convention (DuplicateEffect, AmbiguousEffect), not the
# suffix rule, as `errors.py` already does.
"src/ctrlrun/verify/*.py" = ["ANN401", "N818"]
# The conformance kit's subject matter is an adapter's return value, which is whatever the
# operator's executor returned and has no narrower type — the same reasoning that exempts
# `state.py`'s `commit_effect(result: Any)`. `ConformanceAdapter.invoke -> Any` is frozen in
# SPEC-v0.5 §9 for that reason.
"src/ctrlrun/conformance/*.py" = ["ANN401"]
# An adapter's subject matter is whatever its framework hands back: LangGraph's resume value is
# `Any` by that framework's own signature, and narrowing it to a lie would be worse than saying
# `Any` and validating at the boundary — which is exactly what `LangGraphInterrupt.answer` does.
"adapters/*/src/**/*.py" = ["ANN401"]
# The research harness is outside `src/` and outside the package (SPEC-v0.4 §7.1). It keeps
# the line length and the import rules, because those are about reading it — but it is not
# held to the kernel's typing discipline: its subject matter is a `BaseHTTPRequestHandler`
# override whose signature is stdlib's, and untyped JSON off a loopback socket. N818: the
# refusal names follow this codebase's convention, as `errors.py` already does. PLC0415: an
# adapter imports its framework inside `run()` on purpose — a missing framework must be a
# skipped row and not an import error at module scope.
"research/framework-probe/*.py" = ["ANN401", "N818", "PLC0415"]
"research/framework-probe/**/*.py" = ["ANN401", "N818", "PLC0415"]
# Type hints are a src/ constraint; tests stay cheap to write. N802 lets acceptance
# tests carry the SPEC §7 identifier verbatim (test_T7_...).
"tests/*" = ["ANN", "N802"]
