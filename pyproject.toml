[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrlrun"
version = "0.1.0.dev0"
description = "Make consequential AI-agent actions safe to execute."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Arpan Ghoshal", email = "contact@arpanghoshal.com"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml",
    "click",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=2.3",
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctrlrun = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Error class names are frozen by SPEC-v0.1 §8; no "Error" suffix.
"src/ctrlrun/errors.py" = ["N818"]
# Type hints are a src/ constraint; tests stay cheap to write. N802 lets acceptance
# tests carry the SPEC §7 identifier verbatim (test_T7_...).
"tests/*" = ["ANN", "N802"]
