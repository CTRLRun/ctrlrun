name: Scorecard

# OpenSSF Scorecard: a third party's reading of this repository's practices, published so the
# badge in the README is somebody else's measurement rather than this project's own claim.
# Written from ossf/scorecard's own workflow (read 2026-09-06):
# https://github.com/ossf/scorecard/blob/main/.github/workflows/scorecard-analysis.yml
on:
  branch_protection_rule:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # to upload the SARIF results to code scanning
      id-token: write # the OIDC token that verifies the published result
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing is what makes the badge and the public API results for this repository;
          # it needs `id-token: write` above and nothing else.
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
