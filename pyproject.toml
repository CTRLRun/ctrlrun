[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrlrun"
version = "0.3.0.dev0"
description = "Make consequential AI-agent actions safe to execute."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Arpan Ghoshal", email = "contact@arpanghoshal.com"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml",
    "click",
]

[project.urls]
Homepage = "https://github.com/CTRLRun/ctrlrun"
Repository = "https://github.com/CTRLRun/ctrlrun"
Documentation = "https://github.com/CTRLRun/ctrlrun/tree/main/docs"
Changelog = "https://github.com/CTRLRun/ctrlrun/blob/main/CHANGELOG.md"
Issues = "https://github.com/CTRLRun/ctrlrun/issues"

[project.scripts]
ctrlrun = "ctrlrun.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=2.3",
    "ruff>=0.16",
]
# SPEC-v0.2 §1: `pip install ctrlrun` must not grow. Anything needing an HTTP server or a
# third-party SDK lands here, lazily imported, with `MissingDependency` when it is absent.
#
# The gateway's only dependency is an HTTP client (§6.11): the listening side is stdlib
# `http.server`, and what an ASGI stack would add is a second server, not a capability.
# What is needed is a connect/write/read exception taxonomy precise enough to feed §6.8's
# first row — a gateway that could not tell "never connected" from "no reply" would have to
# call everything AMBIGUOUS, which is safe and useless.
gateway = ["httpx>=0.27"]
# §8's sink hands spans to whatever processor the application configured. The API alone
# would be enough for a library, but an operator installing this extra wants to be able to
# export without assembling a stack, so the SDK and the OTLP/HTTP exporter come with it.
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
# SPEC-v0.3 §3.4 — `JWTIdentityProvider` is the only part of the authority model that needs a
# third party: verifying somebody else's signature. Everything else — grants, containment,
# delegation, observe mode — is stdlib and the YAML parser that is already a dependency.
#
# Empty until build-list item 5, which adds the verifier and the `pyjwt` line it needs. The
# extra is declared now so `pip install 'ctrlrun[identity]'` names something real for the whole
# of the 0.3 development series, and so CI installs it without a second edit.
identity = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctrlrun = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
# PyYAML ships no stubs and types-PyYAML would be a new dependency. safe_load returns
# untyped data either way; policy.py validates every value before use (SPEC-v0.1 §3.4).
module = "yaml"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# So an exclusion means the same thing however ruff is invoked. Without this, a path named
# explicitly on the command line skips the exclude list, and `ruff format docs/SPEC-v0.3.md`
# would reformat what `ruff format` leaves alone — the same surprise in a smaller box.
force-exclude = true

[tool.ruff.format]
# The formatter reads Python code blocks inside Markdown; the linter does not (`ruff check`
# on a `.md` reports "No Python files found"). That asymmetry is a trap: whether a spec's
# examples get reformatted depends on whether they happen to parse, so SPEC-v0.1 and v0.2
# keep their aligned comments only because theirs carry placeholders like `<generated>`, and
# SPEC-v0.3 lost its alignment to a check that had never fired before. A specification's code
# blocks are illustration, not code — they elide, they annotate, they line comments up to be
# read — and the formatter has no way to know that. So it leaves Markdown alone, and the two
# tools now agree on what a `.md` file is.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Error class names are frozen by SPEC-v0.1 §8; no "Error" suffix.
"src/ctrlrun/errors.py" = ["N818"]
# SPEC-v0.1 §5.3 freezes `commit_effect(effect_key, action_id, result: Any)`. An executor's
# return value has no narrower type, and the store only serializes it.
"src/ctrlrun/state.py" = ["ANN401"]
# The gateway's subject matter is untyped JSON off a socket: a JSON-RPC `params`, a tool's
# result, an HTTP client's response object behind a lazy import. Narrowing those to a lie
# would be worse than saying `Any` and validating at the boundary, which is what mcp.py
# does. N818: the error names follow this codebase's convention (DuplicateEffect,
# AmbiguousEffect), not the suffix rule.
"src/ctrlrun/gateway/*.py" = ["ANN401", "N818"]
# Same reasoning for the ACS adapter: its subject matter is an untyped JSON-RPC envelope off
# somebody else's wire, and `_Unknown` follows this codebase's error naming.
"src/ctrlrun/acs.py" = ["ANN401", "N818"]
# The OTel sink holds objects from a lazily-imported SDK: annotating them would mean
# importing `opentelemetry` at module scope, which is the one thing §1.1 forbids.
"src/ctrlrun/otel.py" = ["ANN401"]
# Type hints are a src/ constraint; tests stay cheap to write. N802 lets acceptance
# tests carry the SPEC §7 identifier verbatim (test_T7_...).
"tests/*" = ["ANN", "N802"]
