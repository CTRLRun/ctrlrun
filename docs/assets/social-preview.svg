<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="CTRLRun — Execution safety for AI agents">
  <rect width="1280" height="640" fill="#ffffff"/>
  <rect x="72" y="70" width="60" height="56" rx="14" fill="#B8730A"/>
  <rect x="72" y="65" width="60" height="56" rx="14" fill="#F5A623"/>
  <path d="M92 82 L112 93 L92 104 Z" fill="#14161b" stroke="#14161b" stroke-width="5" stroke-linejoin="round"/>
  <text x="146" y="112" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#14161b">CTRL<tspan font-weight="400">Run</tspan></text>
  <text x="72" y="196" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#8a8f98">CONTROL THE ACTION. KEEP THE AUTONOMY.</text>
  <text x="70" y="278" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-2" fill="#14161b">Execution safety</text>
  <text x="70" y="360" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-2" fill="#14161b">for AI agents<tspan fill="#F5A623">.</tspan></text>
  <text x="72" y="412" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" fill="#6b7280">Let agents act. Keep control of what happens next.</text>
  <rect x="72" y="458" width="1136" height="118" rx="12" fill="#f6f6f4" stroke="#e6e6e2" stroke-width="2"/>
  <rect x="72" y="458" width="6" height="118" rx="3" fill="#F5A623"/>
  <text x="104" y="500" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="700" fill="#B8730A">$ pip install ctrlrun</text>
  <text x="104" y="534" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#14161b">@ctrlrun.protect(tool_name, effect=effect_key)</text>
  <text x="104" y="562" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8a8f98">Refunds. Access changes. Deploys. Emails. One boundary.</text>
  <text x="1208" y="608" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14161b">ctrlrun.dev</text>
</svg>
