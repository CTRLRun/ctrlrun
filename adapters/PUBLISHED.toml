# What is actually on PyPI, and the kernel range that distribution declares.
#
# `test_each_adapter_declares_a_kernel_range_that_contains_this_kernel` checks the range in
# `adapters/<x>/pyproject.toml` against the kernel in this repository. That is a fact about the
# tree. It is not a fact about what a user gets from `pip install`, and the two came apart:
# the range was widened at 0.7, 0.8, 0.9 and 0.10 and the adapter was **never re-published**, so
# `ctrlrun-openai-agents` 1.0.0 went on declaring `ctrlrun<0.6` while the kernel reached 0.10.0.
# `pip install ctrlrun-openai-agents` beside a current kernel then either refuses to resolve or
# silently downgrades ctrlrun to 0.5.x.
#
# This file is the record of the published side: **what `pip download` gets today**, never what a
# tag about to be cut will publish. `test_a_widened_kernel_range_is_not_shipped_without_a_new_version`
# compares it to the tree: if an adapter's range has moved away from what was published, its
# version must have moved too, or the release is one nobody can install. Update a row **after**
# the upload succeeds, not beside the change that motivates it.
#
# **The 0.11.0 release pass got that wrong and the guard said nothing.** It widened the tree to
# `<0.12` and edited this file to `1.1.0 = <0.12` in the same commit, so the two sides agreed and
# the comparison returned early. PyPI had, and still has, `ctrlrun-langgraph` 1.1.0 declaring
# `ctrlrun<0.11`:
#
#     $ curl -s https://pypi.org/pypi/ctrlrun-langgraph/json | jq -r .info.requires_dist[]
#     ctrlrun<0.11,>=0.5
#
# Which is the v0.10 defect this file was written for, recurring one release later, in the file.
#
# **And it went stale a third time, in the opposite direction.** The 0.11.0 release tagged and
# published both adapters at 1.2.0 with `<0.12`, and nobody came back here afterwards, so this
# file spent a release claiming 1.1.0 / `<0.11` while PyPI served 1.2.0 / `<0.12`. The guard below
# said nothing, because a tree that differs from the record *and* carries a higher version is
# exactly the shape of a correct pending release. The rule in the line above -- update the row
# **after** the upload succeeds -- is the one that was not followed, and it is easy to miss
# precisely because the upload is the last thing that happens.
# A record edited to match a claim is not a record. `RECORDED` in `test_packaging.py` freezes the
# range each published version declares, so raising one without a new version now fails.
#
# **And a fourth time, 0.12.0.** Both adapters were tagged and published at 1.3.0 with `<0.13` on
# 2026-09-15, and this file sat at 1.2.0 / `<0.12` until 2026-09-16, found while checking whether a
# 0.12.2 kernel needed an adapter release. Same shape as the third: the guard reads a tree ahead of
# the record as a correct pending release, which is exactly what it looks like, and the upload is
# the last thing that happens so there is nothing after it to remind anyone. Four for four says the
# rule is not the fix. What would be: `publish.yml` refusing to upload an adapter whose version and
# kernel range this file does not already record, which makes the record a precondition of the
# upload instead of a chore after it. Not built; it reverses the rule above and belongs in its own
# change.
#
# The tag carries NO `v`. `publish.yml` reads an adapter tag as everything after the last hyphen,
# so `adapters-langgraph-1.1.0` names 1.1.0 and `adapters-langgraph-v1.1.0` names `v1.1.0` and is
# refused. The `v` prefix belongs to kernel tags, where the workflow strips it. `MAJOR.MINOR` is
# accepted too, per SPEC-v0.5 §6.2. `test_the_tag_an_adapter_release_needs_is_one_publish_yml_accepts`
# runs the workflow's own rules against the version here, so this comment cannot go stale quietly.
#
# It is deliberately hand-written rather than fetched. A test that asked PyPI would need the
# network, and `SPEC-v0.4 §3.9`'s discipline applies: a check that cannot run offline is a check
# that gets skipped in the run that mattered.

# Adapters that exist in the tree and have never been uploaded. An adapter belongs here or in a
# version table below, never in neither: absence alone would let a deleted row read as "not
# published yet", which is this file's guard dying in the one way it has not yet died. A release
# pass moves a name out of here and adds its table **after** the upload succeeds.
unreleased = []

[langgraph]
version = "1.3.0"
kernel = ">=0.5,<0.13"

[openai-agents]
version = "1.3.0"
kernel = ">=0.5,<0.13"

[langchain]
version = "1.0.0"
kernel = ">=0.12,<0.13"
