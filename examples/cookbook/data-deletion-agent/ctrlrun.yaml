schema: ctrlrun.policy/v2

actions:
  records.purge:
    effect: "purge:{record_id}"
    resource: "record:{record_id}"
    rules:
      - when: { legal_hold_eq: true }
        decision: deny
      - when: { age_days_gte: 730 }
        decision: allow
      - decision: approve
